version: '3.8'

services:
  # 1. Interactive Streamlit Clinical Web Application
  streamlit-ui:
    build: .
    container_name: malaria-cdss-ui
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  # 2. Production Clinical REST API (FastAPI)
  fastapi-backend:
    build: .
    container_name: malaria-cdss-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
